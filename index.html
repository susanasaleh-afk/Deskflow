<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deskflow</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D9E75;--green-bg:#E1F5EE;--green-border:#5DCAA5;--green-dark:#0F6E56;
  --red:#D85A30;--red-bg:#FAECE7;--red-border:#F0997B;--red-dark:#993C1D;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-border:#85B7EB;
  --purple:#3C3489;--purple-bg:#EEEDFE;--purple-border:#AFA9EC;
  --amber:#BA7517;--amber-bg:#EAF3DE;--amber-border:#97C459;
  --border:#e5e7eb;--bg:#f4f5f7;--surface:#fff;
  --text:#111827;--text2:#6b7280;--text3:#9ca3af;
  --r:8px;--r-lg:12px;--r-xl:16px;
  font-family:'DM Sans',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh}
.app{display:flex;height:100vh;overflow:hidden}/* Sidebar */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.logo-wrap{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:var(--green-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-size:16px;font-weight:700}.logo-text span{color:var(--green)}
.nav-section{padding:10px 8px}
.nav-label{font-size:10px;color:var(--text3);padding:0 10px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-family:inherit;text-align:left;background:none;color:var(--text2)}
.nav-btn:hover{background:#f3f4f6}
.nav-btn.active{background:var(--green-bg);color:var(--green-dark);font-weight:600}
.offices-section{padding:8px;border-top:1px solid var(--border)}
.office-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:var(--r);border:none;cursor:pointer;font-size:12px;font-family:inherit;text-align:left;background:none;color:var(--text2)}
.office-btn:hover{background:#f3f4f6}
.office-btn.active{background:#f3f4f6;color:var(--text);font-weight:600}
.office-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.user-section{padding:10px 8px;border-top:1px solid var(--border);margin-top:auto}
.user-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);background:#f9fafb;border:1px solid var(--border)}
.user-av{width:30px;height:30px;border-radius:50%;background:var(--green-bg);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.mobile-menu-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text2)}
.mobile-overlay{display:none}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:10px;height:52px;flex-shrink:0}
.topbar-title{flex:1;font-size:15px;font-weight:600}
/* Calendar */
.cal-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.cal-bar-header{display:flex;align-items:center;gap:6px}
.cal-month-label{font-size:13px;font-weight:600;flex:1}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:var(--r);padding:3px 10px;font-size:13px;cursor:pointer;color:var(--text2)}
.cal-nav-btn:hover{background:#f3f4f6}
.cal-today-btn{font-size:11px;padding:3px 10px;background:var(--green-bg);color:var(--green-dark);border:1px solid var(--green-border);border-radius:var(--r);cursor:pointer;font-family:inherit}
.cal-view-toggle{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.cal-view-btn{padding:3px 10px;font-size:11px;border:none;background:none;cursor:pointer;font-family:inherit;color:var(--text2)}
.cal-view-btn.active{background:var(--green-bg);color:var(--green-dark);font-weight:600}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:var(--r);cursor:pointer;border:1.5px solid transparent}
.week-day:hover{background:#f3f4f6}
.week-day.selected{border-color:var(--green);background:var(--green-bg)}
.week-day.holiday{background:var(--red-bg)!important;border-color:var(--red-border)!important;}
.week-day.holiday .wd-num,.week-day.holiday .wd-name{color:var(--red-dark)!important}
.mg-day.holiday{background:var(--red-bg)!important;}
.mg-day.holiday .mg-num{color:var(--red-dark)!important}
.wd-name{font-size:9px;color:var(--text3);text-transform:uppercase}
.wd-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.week-day.today .wd-num{background:var(--green);color:#fff}
.wd-dots{display:flex;gap:2px;justify-content:center;min-height:5px}
.wd-dot{width:4px;height:4px;border-radius:50%}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mg-header{font-size:9px;color:var(--text3);text-transform:uppercase;text-align:center;padding:3px 0}
.mg-day{min-height:34px;padding:3px 5px;border-radius:5px;cursor:pointer;border:1.5px solid transparent}
.mg-day:hover{background:#f3f4f6}
.mg-day.selected{border-color:var(--green);background:var(--green-bg)}
.mg-day.other-month{opacity:.3}
.mg-num{font-size:11px;font-weight:500}
.mg-day.today .mg-num{background:var(--green);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
/* Content */
.content{flex:1;overflow:auto;padding:20px 24px}
/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-val{font-size:24px;font-weight:700}
.stat-sub{font-size:10px;color:var(--text3);margin-top:2px}
/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;overflow:visible}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600}
/* Desk */
.desk{border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;transition:transform .1s,box-shadow .1s;border:1.5px solid transparent;width:44px;height:40px;flex-shrink:0;gap:1px}
.desk:hover:not(.desk-fixed){transform:scale(1.1);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.desk-available{background:var(--green-bg);border-color:var(--green-border);color:var(--green-dark)}
.desk-booked{background:var(--red-bg);border-color:var(--red-border);color:var(--red-dark)}
.desk-mine{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue)}
.desk-fixed{background:var(--purple-bg);border-color:var(--purple-border);color:var(--purple);cursor:default}
.desk-name{font-size:7px;opacity:.8;font-weight:400;max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.cluster-box{background:#f4f5f7;border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:5px}
.desk-pair{display:flex;gap:5px}
/* Zone */
.zone{border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;text-align:center;padding:6px 4px;border:1px solid}
/* Parking */
.parking-grid{display:flex;flex-wrap:wrap;gap:8px;padding:8px}
.parking-spot{border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:56px;border:2px solid;transition:transform .1s;font-size:10px;font-weight:700;gap:2px}
.parking-spot:hover:not(.ps-fixed){transform:scale(1.05)}
.ps-available{background:var(--green-bg);border-color:var(--green-border);color:var(--green-dark)}
.ps-booked{background:var(--red-bg);border-color:var(--red-border);color:var(--red-dark)}
.ps-mine{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue)}
.ps-fixed{background:var(--purple-bg);border-color:var(--purple-border);color:var(--purple);cursor:default}
/* Rooms */
.rooms-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.room-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px}
.room-name{font-size:14px;font-weight:600;margin-bottom:3px}
.room-meta{font-size:11px;color:var(--text2);margin-bottom:8px}
.slot{padding:3px 7px;border-radius:5px;font-size:11px;cursor:pointer;font-weight:500}
.slot-free{background:var(--green-bg);color:var(--green-dark)}
.slot-taken{background:#f3f4f6;color:var(--text3);cursor:default}
.slot-mine{background:var(--blue-bg);color:var(--blue)}
/* Legend */
.legend{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:3px;border:1.5px solid}
/* Banner */
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner-green{background:var(--green-bg);border:1px solid var(--green-border)}
.banner-text{font-size:13px;color:var(--green-dark)}
.banner-btn{padding:5px 12px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
/* Booking list */
.booking-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.booking-item:last-child{border-bottom:none}
.booking-icon{width:38px;height:38px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.cancel-btn{padding:4px 10px;border:1px solid var(--border);border-radius:var(--r);background:none;cursor:pointer;font-size:11px;color:var(--text2);font-family:inherit;flex-shrink:0}
.cancel-btn:hover{background:#f3f4f6}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:26px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:3px}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:18px}
.modal-info{border-radius:var(--r);padding:9px 12px;font-size:13px;margin-bottom:14px}
.modal-info-green{background:var(--green-bg);color:var(--green-dark);border:1px solid var(--green-border)}
.modal-info-red{background:var(--red-bg);color:var(--red-dark);border:1px solid var(--red-border)}
.modal-row{margin-bottom:10px}
.modal-row label{display:block;font-size:10px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.modal-row input,.modal-row select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--bg);font-family:inherit;color:var(--text)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.btn-primary{flex:1;padding:10px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary:hover{background:#178a65}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-secondary{padding:10px 14px;background:none;border:1px solid var(--border);border-radius:var(--r);font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit}
.btn-danger{flex:1;padding:10px;background:var(--red);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
/* Login */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:40px 36px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.08)}
.login-icon{font-size:44px;margin-bottom:10px}
.login-title{font-size:24px;font-weight:700;margin-bottom:5px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.user-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.user-chip{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;text-align:left;background:none;width:100%;font-family:inherit}
.user-chip:hover{border-color:var(--green);background:var(--green-bg)}
.chip-av{width:30px;height:30px;border-radius:50%;background:var(--green-bg);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.chip-name{font-size:13px;font-weight:600}
.or-divider{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--text3);font-size:11px}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.login-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;margin-bottom:8px;outline:none}
.login-input:focus{border-color:var(--green)}
.login-btn{width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.login-btn:hover{background:#178a65}
.login-hint{font-size:10px;color:var(--text3);margin-top:10px}
/* Empty */
.empty-state{padding:40px;text-align:center;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:3px}
/* Toast */
.toast{position:fixed;bottom:20px;right:20px;color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast-success{background:var(--green)}.toast-error{background:var(--red)}
/* Edit mode */
.edit-btn{padding:5px 12px;font-size:11px;border:1px solid var(--border);border-radius:var(--r);background:none;cursor:pointer;font-family:inherit;color:var(--text2)}
.edit-btn:hover{background:#f3f4f6}
.edit-btn.active{background:var(--green-bg);color:var(--green-dark);border-color:var(--green-border);font-weight:600}
/* Map canvas */
.map-scroll-wrap{display:block;width:100%;overflow:scroll;-webkit-overflow-scrolling:touch;max-height:70vh;}
.map-canvas{position:relative;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overflow:visible}
.map-canvas.edit-on{background:#EEF6FF;border:1.5px dashed var(--blue-border);border-radius:var(--r-lg);padding:8px}
.map-el{position:absolute;cursor:default}
.map-el.dragging{opacity:.85;z-index:200;cursor:grabbing}
.edit-hint{font-size:11px;color:var(--blue);background:var(--blue-bg);border:1px solid var(--blue-border);border-radius:var(--r);padding:6px 12px;margin-bottom:8px}
/* Map zone label */
.map-zone{border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;text-align:center;padding:5px 4px;border:1px solid;position:relative;user-select:none;overflow:visible}
.map-zone .rot-btn{display:none;position:absolute;top:-8px;right:-8px;background:var(--blue);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;z-index:10;align-items:center;justify-content:center}
.map-el.editable .map-zone .rot-btn{display:flex}
.map-el.editable .map-zone{cursor:grab;outline:2px dashed var(--blue-border)}
.map-el.editable .map-zone:active{cursor:grabbing}
/* Rename input */
.rename-input{background:transparent;border:none;outline:none;font-size:inherit;font-weight:inherit;font-family:inherit;color:inherit;text-align:center;width:100%;cursor:text}
/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:99px}
@media(max-width:768px){
.map-canvas{min-width:1000px;touch-action:pan-x pan-y;}
.content{overflow:auto;}
.floor-section{overflow:auto;-webkit-overflow-scrolling:touch;}
.sidebar{display:none;position:fixed;top:0;left:0;height:100vh;z-index:1000;box-shadow:4px 0 20px rgba(0,0,0,0.15)}.sidebar.open{display:flex}.stats-row{grid-template-columns:repeat(2,1fr)}.rooms-grid{grid-template-columns:1fr}.mobile-menu-btn{display:flex!important}.mobile-overlay{display:block!important;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:999}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══ CONFIG ═══
const TENANT_ID='f13ca579-d0a9-491c-bc49-b0b93da07687';
const CLIENT_ID='c9be447a-dc70-4a61-bbbc-4e7b1e96a6ed';

const _msal=new msal.PublicClientApplication({
  auth:{
    clientId:CLIENT_ID,
    authority:'https://login.microsoftonline.com/'+TENANT_ID,
    redirectUri:'https://gig-deskflow.vercel.app',
  },
  cache:{cacheLocation:'localStorage',storeAuthStateInCookie:false},
});

// Auth helpers
const Auth={
  async init(){
    await _msal.initialize();
    try{
      const resp = await _msal.handleRedirectPromise();
      if(resp && resp.account){
        _msal.setActiveAccount(resp.account);
        return resp.account;
      }
    }catch(e){
      console.warn('MSAL redirect error:',e.message);
      // Clear any stuck interaction state
      sessionStorage.clear();
    }
    const accounts = _msal.getAllAccounts();
    if(accounts.length>0){
      _msal.setActiveAccount(accounts[0]);
      return accounts[0];
    }
    return null;
  },
  async signIn(){
    try{
      const resp = await _msal.loginPopup({scopes:['openid','profile','User.Read']});
      if(resp && resp.account){
        _msal.setActiveAccount(resp.account);
        Auth._account = resp.account;
        Auth._cachedToken = resp.idToken;
      }
    }catch(e){
      console.error('Login failed:',e);
    }
  },
  signOut(){
    const account=_msal.getActiveAccount();
    _msal.logoutRedirect({account, postLogoutRedirectUri:'https://gig-deskflow.vercel.app'});
  },
  getUser(){
    const account=_msal.getActiveAccount();
    if(!account)return null;
    return {
      id: account.localAccountId,
      name: account.name||account.username.split('@')[0],
      email: account.username,
      initials: (account.name||account.username).split(' ').map(w=>w[0]?.toUpperCase()||'').slice(0,2).join(''),
      office: DB.get('user_office')||'Marbella'
    };
  }
};

// ─── DB (localStorage for layout/prefs only) ───

const ADMINS=['susana.saleh@gig.com','richard.carter@gig.com','boban.jovanovic@gig.com','lisa.cachia@gig.com','juliana.pereira@gig.com','eva.csipan@gig.com'];

// ═══ USERS ═══
const USERS={
  async upsert(user){
    // Only send office — backend takes id/name/email from token
    await api('users','POST',{id:user.id, office:user.office||'Marbella'});
  },
  async load(){
    const data=await api('users');
    DEMO_USERS.length=0;
    data.forEach(u=>DEMO_USERS.push({id:u.id,name:u.name,email:u.email,initials:(u.name||'').split(' ').map(w=>w[0]?.toUpperCase()||'').slice(0,2).join(''),office:u.office||'Marbella'}));
    const adminsFromDB=data.filter(u=>u.is_admin).map(u=>u.email);
    adminsFromDB.forEach(e=>{if(!ADMINS.includes(e))ADMINS.push(e);});
  },
  async setAdmin(email,isAdmin){
    const user=DEMO_USERS.find(u=>u.email===email);
    if(user) await api('users','POST',{id:user.id,name:user.name,email:user.email,office:user.office,is_admin:isAdmin});
  },
  async remove(id){
    await api('users','DELETE',null,{id});
    await this.load();
  },

// ═══ API helper ═══
function getMSALIdentity(){
  const account=Auth._account||_msal.getActiveAccount()||(_msal.getAllAccounts()||[])[0];
  if(!account) return null;
  return {
    id: account.localAccountId,
    email: account.username,
    name: account.name||account.username.split('@')[0],
    tid: account.tenantId
  };
}

async function getToken(){
  // Use token cached during login
  if(Auth._cachedToken){
    try{
      const p=JSON.parse(atob(Auth._cachedToken.split('.')[1]));
      if(p.exp > Date.now()/1000) return Auth._cachedToken;
    }catch(e){}
  }
  // Try acquireTokenSilent
  try{
    const account=Auth._account||_msal.getActiveAccount()||(_msal.getAllAccounts()||[])[0];
    if(account){
      const resp=await _msal.acquireTokenSilent({scopes:['openid'],account});
      if(resp?.idToken){Auth._cachedToken=resp.idToken;return resp.idToken;}
    }
  }catch(e){}
  return null;
}

async function api(path, method='GET', body=null, params=null){
  let url='/api/'+path;
  if(params) url+='?'+new URLSearchParams(params).toString();
  const token=await getToken();
  const identity=getMSALIdentity();
  const headers={'Content-Type':'application/json'};
  if(token) headers['Authorization']='Bearer '+token;
  // Always send identity headers as fallback
  if(identity){
    headers['X-User-Id']=identity.id;
    headers['X-User-Email']=identity.email;
    headers['X-User-Name']=identity.name;
    headers['X-Tenant-Id']=identity.tid;
  }
  const opts={method,headers};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||r.statusText);}
  return r.json();
}

function ds(n=0){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().split('T')[0]}
function dispDate(n=0){
  const d=new Date();d.setDate(d.getDate()+n);
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dy=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const s=mo[d.getMonth()]+' '+d.getDate();
  if(n===0)return'Today, '+s;if(n===1)return'Tomorrow, '+s;if(n===-1)return'Yesterday, '+s;
  return dy[d.getDay()]+', '+s;
}
function fmtD(str){
  const d=new Date(str+'T12:00:00');
  if(str===ds(0))return'Today';if(str===ds(1))return'Tomorrow';
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}

// ═══ DRAG ENGINE ═══
function initDrag(el,office,key){
  const onDown=e=>{
    if(!S.editMode)return;
    if(e.target.tagName==='INPUT')return;
    if(e.target.tagName==='BUTTON'&&!e.target.classList.contains('drag-handle'))return;
    e.preventDefault();e.stopPropagation();
    const canvas=document.getElementById('map-canvas-'+office);
    if(!canvas)return;
    const rect=canvas.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left-(parseInt(el.style.left)||0);
    const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top-(parseInt(el.style.top)||0);
    el.classList.add('dragging');
    const onMove=e=>{
      const px=(e.touches?e.touches[0].clientX:e.clientX)-rect.left-cx;
      const py=(e.touches?e.touches[0].clientY:e.clientY)-rect.top-cy;
      el.style.left=Math.max(0,px)+'px';el.style.top=Math.max(0,py)+'px';
    };
    const onUp=()=>{
      el.classList.remove('dragging');
      const pos=MP.get(office);
      pos[key]={x:parseInt(el.style.left),y:parseInt(el.style.top)};
      MP.set(office,pos);
      document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
      el.removeEventListener('touchmove',onMove);el.removeEventListener('touchend',onUp);
    };
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    if(S.editMode&&window.innerWidth>768){el.addEventListener('touchmove',onMove,{passive:false});el.addEventListener('touchend',onUp);}
  };
  el.addEventListener('mousedown',onDown);
  if(S.editMode&&window.innerWidth>768)el.addEventListener('touchstart',onDown,{passive:false});
}

function makeEl(office,key,x,y,content,extraStyle=''){
  const saved=MP.get(office)[key];
  const px=saved?saved.x:x;const py=saved?saved.y:y;
  return '<div class="map-el'+(S.editMode?' editable':'')+'" data-key="'+key+'" style="position:absolute;left:'+px+'px;top:'+py+'px;'+extraStyle+'">'+content+'</div>';
}

function makeZone(office,key,label,bg,bc,tc,w,h,dashed,rotation){
  const rot=rotation||DB.get('rot_'+office+'_'+key,0);
  const rotStyle=rot?';transform:rotate('+rot+'deg)':'';
  const border=dashed?'2px dashed '+bc:'1px solid '+bc;
  const displayLabel=EL.get(office,key,label);
  return '<div class="map-zone" style="background:'+bg+';border:'+border+';color:'+tc+';width:'+w+'px;min-height:'+h+'px;font-size:9px;font-weight:600'+rotStyle+'">'+
    (S.editMode?'<button class="rot-btn" data-rot-key="'+key+'">&#8635;</button>':'')+
    '<span class="zone-label" data-label-key="'+key+'" style="cursor:'+(S.editMode?'text':'default')+'">'+displayLabel+'</span>'+
  '</div>';
}

function bindCanvas(office){
  if(S.editMode&&window.innerWidth>768){
    document.querySelectorAll('.map-el[data-key]').forEach(el=>{
      const key=el.dataset.key;

  document.querySelectorAll('[data-rot-key]').forEach(btn=>{
    btn.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault()});
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const key=btn.dataset.rotKey;
      const cur=DB.get('rot_'+office+'_'+key,0);
      DB.set('rot_'+office+'_'+key,(cur+90)%360);
      render();
    });
  });
  // Rename desks on dblclick (Madrid only)
  document.querySelectorAll('[data-rename]').forEach(function(el){
    el.addEventListener('mousedown',function(e){if(S.editMode&&e.detail>=2)e.stopPropagation()});
    el.addEventListener('dblclick',function(e){
      if(!S.editMode)return;
      e.stopPropagation();
      var id=el.dataset.rename;
      var cur=EL.get(S.office,'desk_'+id,id);
      var span=el.querySelector('span');
      if(!span)return;
      var input=document.createElement('input');
      input.value=cur;input.style.cssText='width:34px;font-size:9px;font-weight:700;text-align:center;background:transparent;border:none;outline:none;font-family:inherit;color:inherit';
      span.replaceWith(input);input.focus();input.select();
      var save=function(){EL.set(S.office,'desk_'+id,input.value.trim()||id);render()};
      input.addEventListener('blur',save);
      input.addEventListener('keydown',function(e){if(e.key==='Enter')save();if(e.key==='Escape'){EL.set(S.office,'desk_'+id,id);render()}});
    });
  });

  // Rename on dblclick
  document.querySelectorAll('.zone-label[data-label-key]').forEach(span=>{
    span.addEventListener('mousedown',e=>{if(S.editMode)e.stopPropagation()});
    span.addEventListener('dblclick',e=>{
      e.preventDefault();
      if(!S.editMode)return;
      e.stopPropagation();
      const key=span.dataset.labelKey;
      const cur=span.textContent;
      const input=document.createElement('input');
      input.className='rename-input';input.value=cur;input.style.width=(cur.length*8+20)+'px';
      span.replaceWith(input);input.focus();input.select();
      const save=()=>{EL.set(office,key,input.value.trim()||cur);render()};
      input.addEventListener('blur',save);
      input.addEventListener('keydown',e=>{if(e.key==='Enter')save();if(e.key==='Escape'){EL.set(office,key,cur);render()}});
    });
  });
  // Save desk rename inputs (Madrid)
  document.querySelectorAll('[data-desk-rename]').forEach(function(input){
    // no stopPropagation - drag works on the outer map-el
    input.addEventListener('change',function(){
      EL.set(office,'desk_'+input.dataset.deskRename, input.value.trim());
    });
    input.addEventListener('keydown',function(e){
      if(e.key==='Enter'){input.blur();}
    });
  });

  // Edit toggle
  document.getElementById('btn-export-'+office)?.addEventListener('click',()=>{
    const pos=MP.get(office);
    const rot={},labels={};
    Object.keys(localStorage).forEach(function(key){
      if(key.startsWith('df_rot_'+office+'_'))rot[key.replace('df_rot_'+office+'_','')]=JSON.parse(localStorage[key]);
      if(key.startsWith('df_el_'+office+'_'))labels[key.replace('df_el_'+office+'_','')]=JSON.parse(localStorage[key]);
    });
    const data=JSON.stringify({pos,rot,labels},null,2);
    navigator.clipboard.writeText(data).then(()=>toast('Copied! Paste to Claude ✓')).catch(()=>{
      const ta=document.createElement('textarea');ta.value=data;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied! ✓');
    });
  });
  document.getElementById('btn-import-'+office)?.addEventListener('click',()=>{
    const raw=prompt('Paste layout JSON:');
    if(!raw)return;
    try{
      const data=JSON.parse(raw);
      const snap=function(n){return Math.round(n/10)*10};
      if(data.pos){const snapped={};Object.entries(data.pos).forEach(function(e){snapped[e[0]]={x:snap(e[1].x),y:snap(e[1].y)};});MP.set(office,snapped);}
      if(data.rot)Object.entries(data.rot).forEach(function(e){DB.set('rot_'+office+'_'+e[0],e[1]);});
      if(data.labels)Object.entries(data.labels).forEach(function(e){EL.set(office,e[0],e[1]);});
      toast('Layout imported ✓');render();
    }catch(e){toast('Invalid JSON','error');}
  });
    // Mobile menu
  var mobileMenuBtn=document.getElementById('mobile-menu');
  var sidebar=document.querySelector('.sidebar');
  if(mobileMenuBtn&&sidebar){
    mobileMenuBtn.addEventListener('click',function(){
      sidebar.classList.toggle('open');
      var ov=document.getElementById('mobile-overlay');
      if(!ov){
        ov=document.createElement('div');
        ov.id='mobile-overlay';
        ov.className='mobile-overlay';
        ov.addEventListener('click',function(){sidebar.classList.remove('open');ov.style.display='none';});
        document.body.appendChild(ov);
      }
      ov.style.display=sidebar.classList.contains('open')?'block':'none';
    });
  }
  document.getElementById('btn-edit-'+office)?.addEventListener('click',()=>{
    setState({editMode:!S.editMode});
  });
  // Reset
  document.getElementById('btn-reset-'+office)?.addEventListener('click',()=>{
    MP.reset(office);toast('Layout reset');render();
  });
}

// ─── CALENDAR ───
function renderCalBar(){return S.calView==='week'?renderWeek():renderMonth()}
function getWDays(){
  const today=new Date(),dow=today.getDay(),mo=dow===0?-6:1-dow,days=[];
  for(let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()+mo+S.calWeekStart*7+i);days.push(d)}
  return days;
}
function dOff(d){const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);return Math.round((x-t)/86400000)}
function renderWeek(){
  const days=getWDays(),allB=BK._userCache||[],mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],dNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const f=days[0],l=days[6];
  let ml=mos[f.getMonth()]+' '+f.getFullYear();
  if(f.getMonth()!==l.getMonth())ml=mos[f.getMonth()]+' - '+mos[l.getMonth()]+' '+l.getFullYear();
  return '<div class="cal-bar"><div class="cal-bar-header">'+
    '<button class="cal-nav-btn" id="cal-prev">&#8249;</button>'+
    '<div class="cal-month-label">'+ml+'</div>'+
    '<button class="cal-nav-btn" id="cal-next">&#8250;</button>'+
    (S.calWeekStart!==0?'<button class="cal-today-btn" id="cal-today">This week</button>':'')+
    '<div class="cal-view-toggle"><button class="cal-view-btn'+(S.calView==='week'?' active':'')+'" data-calview="week">Week</button><button class="cal-view-btn'+(S.calView==='month'?' active':'')+'" data-calview="month">Month</button></div>'+
  '</div><div class="week-strip">'+
    days.map((d,i)=>{
      const str=d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate(),off=dOff(d);
      const myB=allB.filter(b=>b.date===str&&b.userId===S.user.id);
      const dots=[];
      if(myB.find(b=>b.type==='desk'))dots.push('var(--blue)');
      if(myB.find(b=>b.type==='room'))dots.push('var(--green)');
      if(myB.find(b=>b.type==='parking'))dots.push('var(--amber)');
      var hol=isHoliday(S.office,str);
  return '<div class="week-day'+(str===ds(0)?' today':'')+(str===ds(S.dayOffset)?' selected':'')+(hol?' holiday':'')+'" data-dayoffset="'+off+'" title="'+(hol||'')+'">'+
        '<div class="wd-name">'+dNames[i]+'</div>'+
        '<div class="wd-num">'+d.getDate()+'</div>'+
        '<div class="wd-dots">'+dots.map(c=>'<div class="wd-dot" style="background:'+c+'"></div>').join('')+'</div>'+
      '</div>';
    }).join('')+
  '</div></div>';
}
function renderMonth(){
  const today=new Date(),ref=new Date(today.getFullYear(),today.getMonth()+S.calMonthOffset,1);
  const mos=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const allB=BK._userCache||[];
  const first=new Date(ref.getFullYear(),ref.getMonth(),1),last=new Date(ref.getFullYear(),ref.getMonth()+1,0);
  const sdow=first.getDay()===0?6:first.getDay()-1,cells=[];
  for(let i=0;i<sdow;i++){const d=new Date(first);d.setDate(d.getDate()-(sdow-i));cells.push({d,other:true})}
  for(let i=1;i<=last.getDate();i++)cells.push({d:new Date(ref.getFullYear(),ref.getMonth(),i),other:false});
  const rem=7-(cells.length%7);if(rem<7)for(let i=1;i<=rem;i++){const d=new Date(last);d.setDate(d.getDate()+i);cells.push({d,other:true})}
  return '<div class="cal-bar"><div class="cal-bar-header">'+
    '<button class="cal-nav-btn" id="cal-prev">&#8249;</button>'+
    '<div class="cal-month-label">'+mos[ref.getMonth()]+' '+ref.getFullYear()+'</div>'+
    '<button class="cal-nav-btn" id="cal-next">&#8250;</button>'+
    (S.calMonthOffset!==0?'<button class="cal-today-btn" id="cal-today">This month</button>':'')+
    '<div class="cal-view-toggle"><button class="cal-view-btn'+(S.calView==='week'?' active':'')+'" data-calview="week">Week</button><button class="cal-view-btn'+(S.calView==='month'?' active':'')+'" data-calview="month">Month</button></div>'+
  '</div><div class="month-grid">'+
    dNames.map(n=>'<div class="mg-header">'+n+'</div>').join('')+
    cells.map(function(cell){
      const str=cell.d.getFullYear()+'-'+(cell.d.getMonth()<9?'0':'')+(cell.d.getMonth()+1)+'-'+(cell.d.getDate()<10?'0':'')+cell.d.getDate(),off=dOff(cell.d);
      const myB=allB.filter(b=>b.date===str&&b.userId===S.user.id);
      const dots=[];
      if(myB.find(b=>b.type==='desk'))dots.push('var(--blue)');
      if(myB.find(b=>b.type==='room'))dots.push('var(--green)');
      if(myB.find(b=>b.type==='parking'))dots.push('var(--amber)');
      return '<div class="mg-day'+(str===ds(0)?' today':'')+(str===ds(S.dayOffset)?' selected':'')+(isHoliday(S.office,str)?' holiday':'')+(cell.other?' other-month':'')+'" data-dayoffset="'+off+'">'+
        '<div class="mg-num">'+cell.d.getDate()+'</div>'+
        '<div style="display:flex;gap:2px;flex-wrap:wrap">'+dots.map(c=>'<div style="width:4px;height:4px;border-radius:50%;background:'+c+'"></div>').join('')+'</div>'+
      '</div>';
    }).join('')+
  '</div></div>';
}

// ─── FLOOR MAP ───
function renderFloorMap(){
  const cfg=OFFICES[S.office],date=ds(S.dayOffset);
  const bookings=BK.forOD(S.office,date),deskB=bookings.filter(b=>b.type==='desk');
  const getB=id=>deskB.find(b=>b.resourceId===id);
  const isFF=id=>!!cfg.fixedDesks[id]&&FF.isFree(S.office,id,date);
  const recurPerson=id=>RF.person(S.office,id,date);
  const isRecur=id=>!cfg.fixedDesks[id]&&!!recurPerson(id)&&!FF.isFree(S.office,id,date);
  const dCls=id=>{
    const fix=!!cfg.fixedDesks[id];
    if(fix&&!isFF(id))return'desk-fixed';
    if(!fix&&isRecur(id))return'desk-fixed';
    const b=getB(id);if(!b)return'desk-available';
    if(b.userId===S.user.id)return'desk-mine';
    return'desk-booked';
  };
  const D=id=>{
    const cls=dCls(id),fn=cfg.fixedDesks[id]||recurPerson(id),freed=isFF(id),rec=isRecur(id);
    const lbl=freed?'\ud83d\udd13':rec?'\ud83d\udd01'+(fn||''):(fn||'');
    const title=freed?id+' (released)':fn?'Fixed - '+fn:id;
    const _bbyFull=cls==='desk-booked'?getB(id)?.userName:'';
    const bby=_bbyFull?_bbyFull.split(' ').map(function(w){return w[0]}).join('').toUpperCase():'';
    const ci=CI.get(S.office,id,date);
    const ciTag=ci?' \u2713':'';
    return '<div class="desk '+cls+'" data-desk="'+id+'" title="'+(cls==='desk-mine'?S.user.name:bby?'Booked by '+bby:title)+'">'+
      '<span>'+deskLabel(id)+ciTag+'</span><span class="desk-name">'+(cls==='desk-booked'?bby:cls==='desk-mine'?S.user.initials:lbl)+'</span>'+
    '</div>';
  };
  const allDesks=cfg.allDesks||[];
  const total=allDesks.length,booked=deskB.length;
  const avail=allDesks.filter(id=>{
    const fix=!!cfg.fixedDesks[id],freed=fix&&FF.isFree(S.office,id,date),rec=isRecur(id);
    return(!fix||freed)&&!rec&&!getB(id);
  }).length;
  const myDesk=deskB.find(b=>b.userId===S.user.id);
  const ci=myDesk?CI.get(S.office,myDesk.resourceId,date):null;

  const editBar='<div style="display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap">'+
    '<button id="btn-edit-'+S.office+'" class="edit-btn'+(S.editMode?' active':'')+'">'+
      (S.editMode?'&#10003; Done':'&#9998; Edit layout')+
    '</button>'+
    (S.editMode?'<button id="btn-reset-'+S.office+'" class="edit-btn" style="color:var(--red)">&#8635; Reset</button>':'')+
    (S.editMode?'<button id="btn-export-'+S.office+'" class="edit-btn" style="color:var(--blue)">&#8659; Export</button>':'')+
    (S.editMode?'<button id="btn-import-'+S.office+'" class="edit-btn" style="color:var(--green-dark)">&#8657; Import</button>':'')+
    (S.editMode?'<span class="edit-hint" style="margin-bottom:0">Drag to move &middot; Double-click label to rename &middot; &#8635; to rotate</span>':'')+
  '</div>';

  let mapHtml='';
  try{
    if(cfg.layout==='marbella')mapHtml=renderMarbella(cfg,D,date);
    else if(cfg.layout==='malta')mapHtml=renderMalta(cfg,D);
    else if(cfg.layout==='madrid')mapHtml=renderMadrid(cfg,D);
    else if(cfg.layout==='barcelona')mapHtml=renderBarcelona(cfg,D);
    else if(cfg.layout==='toulouse')mapHtml=renderToulouse(cfg,D);
  }catch(e){mapHtml='<div style="padding:20px;color:red;font-size:14px"><b>Error loading map:</b><br>'+e.message+'<br><br>'+e.stack+'</div>';}

  return '<div class="stats-row">'+
    '<div class="stat-card"><div class="stat-lbl">Available</div><div class="stat-val" style="color:'+cfg.color+'">'+avail+'</div><div class="stat-sub">desks free</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">Booked</div><div class="stat-val">'+booked+'</div><div class="stat-sub">of '+total+'</div></div>'+

// ─── ROOMS ───
function renderRooms(){
  var cfg=OFFICES[S.office],date=ds(S.dayOffset);
  var bookings=BK.forOD(S.office,date).filter(function(b){return b.type==='room'});
  var getB=function(r,s){return bookings.find(function(b){return b.resourceId===r&&b.roomSlot===s})};
  var sCls=function(r,s){var b=getB(r,s);if(!b)return'slot-free';if(b.userId===S.user.id)return'slot-mine';return'slot-taken'};
  var freeR=cfg.rooms.filter(function(r){return TIME_SLOTS.some(function(s){return!getB(r,s)})}).length;
  var totalS=cfg.rooms.reduce(function(s,r){return s+(cfg.roomCaps[r]||0)},0);
  return '<div class="stats-row">'+
    '<div class="stat-card"><div class="stat-lbl">Available rooms</div><div class="stat-val" style="color:var(--green)">'+freeR+'</div><div class="stat-sub">of '+cfg.rooms.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">Total seats</div><div class="stat-val">'+totalS+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">Your meetings</div><div class="stat-val">'+bookings.filter(function(b){return b.userId===S.user.id}).length+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">Office</div><div class="stat-val" style="font-size:15px">'+S.office+'</div></div>'+
  '</div>'+
  '<div class="rooms-grid">'+cfg.rooms.map(function(room){
    return '<div class="room-card"><div class="room-name">'+room+'</div>'+
      '<div class="room-meta">\ud83d\udc65 '+(cfg.roomCaps[room]||'?')+' seats &middot; TV &middot; Video</div>'+
      '<div style="display:flex;gap:4px;flex-wrap:wrap">'+
        TIME_SLOTS.map(function(slot){
          var cls=sCls(room,slot),b=getB(room,slot);
          return '<div class="slot '+cls+'" data-room="'+room+'" data-slot="'+slot+'" title="'+(b&&b.userId!==S.user.id?'Booked by '+b.userName:'')+'">'+slot+'</div>';
        }).join('')+
      '</div></div>';
  }).join('')+'</div>';
}

// ─── PARKING ───
function renderParking(){
  var cfg=OFFICES[S.office];
  if(!cfg.parking?.length)return'<div class="card"><div class="empty-state"><div class="empty-icon">\ud83c\udd7f\ufe0f</div><div class="empty-title">No parking available</div></div></div>';
  var date=ds(S.dayOffset),bookings=BK.forOD(S.office,date).filter(function(b){return b.type==='parking'});
  var getB=function(id){return bookings.find(function(b){return b.resourceId===id})};
  var sCls=function(id){if(cfg.fixedParking[id])return'ps-fixed';var b=getB(id);if(!b)return'ps-available';if(b.userId===S.user.id)return'ps-mine';return'ps-booked'};
  var avail=cfg.parking.filter(function(id){return!cfg.fixedParking[id]&&!getB(id)}).length;
  var mySpot=bookings.find(function(b){return b.userId===S.user.id});

// ─── MY BOOKINGS ───
function renderMyBookings(){
  var bookings=BK.forUser();
  var icons={desk:'\ud83d\udcbb',room:'\ud83d\udeaa',parking:'\ud83d\ude97'},colors={desk:'#FAECE7',room:'#E6F1FB',parking:'#EAF3DE'};

  // Check if user has a fixed desk in any office
  var fixedInfo=null;
  Object.keys(OFFICES).forEach(function(o){
    var fd=OFFICES[o].fixedDesks||{};
    Object.keys(fd).forEach(function(deskId){
      if(fd[deskId]===S.user.name||(S.user.fixedDesk&&deskId===S.user.fixedDesk&&o===S.user.office)){
        fixedInfo={office:o,deskId:deskId};
      }
    });
  });
  // Also check by userId match on fixedDesks value
  if(!fixedInfo){
    Object.keys(OFFICES).forEach(function(o){
      var fd=OFFICES[o].fixedDesks||{};
      Object.keys(fd).forEach(function(deskId){
        if(fd[deskId]===S.user.name) fixedInfo={office:o,deskId:deskId};
      });
    });
  }

  // Build remaining days of current week (Mon-Fri, today onwards)
  var fixedUpcoming=[];
  if(fixedInfo){
    var today=new Date();today.setHours(0,0,0,0);
    var dow=today.getDay();
    var daysToMon=dow===0?6:dow-1;
    var mon=new Date(today);mon.setDate(today.getDate()-daysToMon);
    for(var d=0;d<5;d++){
      var day=new Date(mon);day.setDate(mon.getDate()+d);
      if(day>=today){
        var y=day.getFullYear(),m=day.getMonth()+1,dd=day.getDate();
        var dateStr=y+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
        // Don't duplicate if already in flex bookings
        if(!bookings.some(function(b){return b.date===dateStr&&b.type==='desk'})){
          fixedUpcoming.push({date:dateStr,office:fixedInfo.office,deskId:fixedInfo.deskId,fixed:true});
        }
      }
    }
  }

  var allUpcoming=fixedUpcoming.concat(bookings).sort(function(a,b){return a.date>b.date?1:-1});
  var totalUpcoming=allUpcoming.length;

  return '<div class="stats-row">'+
    '<div class="stat-card"><div class="stat-lbl">Upcoming</div><div class="stat-val">'+totalUpcoming+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">Desks</div><div class="stat-val">'+(bookings.filter(function(b){return b.type==='desk'}).length+(fixedUpcoming.length))+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">Meetings</div><div class="stat-val">'+bookings.filter(function(b){return b.type==='room'}).length+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">Parking</div><div class="stat-val">'+bookings.filter(function(b){return b.type==='parking'}).length+'</div></div>'+
  '</div>'+
  (totalUpcoming===0?
    '<div class="card"><div class="empty-state"><div class="empty-icon">\ud83d\udcc5</div><div class="empty-title">No upcoming bookings</div><div style="font-size:12px">Go to the floor map to book a desk, room or parking spot.</div></div></div>'
  :
    '<div class="card" style="padding:0;overflow:hidden">'+
      '<div style="padding:12px 18px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600">Upcoming reservations</div>'+
      allUpcoming.map(function(b){
        if(b.fixed){
          return '<div class="booking-item">'+
            '<div class="booking-icon" style="background:#FAECE7">\ud83d\udcbb</div>'+
            '<div style="flex:1;min-width:0">'+
              '<div style="font-size:13px;font-weight:600">Desk '+deskLabel(b.deskId)+' <span style="font-size:10px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);border-radius:4px;padding:1px 6px;margin-left:4px">Fixed</span></div>'+
              '<div style="font-size:11px;color:var(--text2)">'+b.office+' &middot; '+fmtD(b.date)+' &middot; All day</div>'+
            '</div>'+
          '</div>';
        }
        return '<div class="booking-item">'+
          '<div class="booking-icon" style="background:'+colors[b.type]+'">'+icons[b.type]+'</div>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-size:13px;font-weight:600">'+(b.type==='room'?b.resourceId+' Room':b.type==='parking'?'Parking '+b.resourceId:'Desk '+deskLabel(b.resourceId))+'</div>'+
            '<div style="font-size:11px;color:var(--text2)">'+b.office+' &middot; '+fmtD(b.date)+(b.roomSlot?' &middot; '+b.roomSlot:' &middot; All day')+(b.roomTitle?' &middot; "'+b.roomTitle+'"':'')+'</div>'+
          '</div>'+
          '<button class="cancel-btn" data-cancel="'+b.id+'">Cancel</button>'+
        '</div>';
      }).join('')+
    '</div>'
  );
}

    '</div>';
    html+='<div style="display:flex;flex-direction:column;gap:10px" id="rpt-weeks">';
    weekStats.forEach(function(ws,wi){

      var hasNS=ns>0;
      var isExpanded=(wi===weekStats.length-1);

      html+='<div class="rpt-week-hdr" data-wi="'+wi+'" style="cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none">'+

        '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
          '<span style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px">'+booked+' booked</span>'+
          '<span style="background:var(--green-bg);border:1px solid var(--green-border);border-radius:4px;padding:2px 8px;font-size:11px;color:var(--green-dark)">'+ci+' in</span>'+

      '</div>';
      if(booked>0){

          '<div style="height:100%;width:'+rate+'%;background:var(--red);border-radius:3px"></div></div>';
      }
      html+='<div class="rpt-week-body" data-wi="'+wi+'" style="display:'+(isExpanded?'block':'none')+'"><div style="margin-top:12px">';

function renderModal(){
  var m=S.modal,date=ds(S.dayOffset);
  var labels={desk:'Desk',room:'Meeting room',parking:'Parking spot'},lbl=labels[m.type];
  var existing=m.type==='room'?BK.isBooked(S.office,date,'room',m.id,m.slot):BK.isBooked(S.office,date,m.type,m.id);
  var cfg=OFFICES[S.office];
  var fixedName=cfg.fixedDesks&&cfg.fixedDesks[m.id]||'';
  var userWords=S.user.name.toLowerCase().split(' ');
  var fixedWords=fixedName.toLowerCase().split(' ');
  var isMyFixed=m.type==='desk'&&fixedName.length>0&&userWords.some(function(w){return w.length>2&&fixedWords.some(function(f){return f.indexOf(w)>-1||w.indexOf(f)>-1;});});
  var isMine=(existing?.userId===S.user.id)||isMyFixed;
  var isBooked=!!existing&&existing.userId!==S.user.id&&!isMyFixed;
  var dateDisplay=new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  return '<div class="modal-overlay" id="mo"><div class="modal">'+
    '<h3>'+(isMine?'Your '+lbl.toLowerCase():isBooked?lbl+' occupied':'Book '+lbl.toLowerCase())+'</h3>'+
    (m.type==='parking'?'<div style="background:#FEF9E7;border:1px solid #E8C97A;border-radius:var(--r);padding:8px 12px;font-size:12px;color:#8A6A00;margin-bottom:8px">🚗 You are booking <strong>parking access</strong> for the day, not a specific spot.</div>':'')+
    '<div class="modal-sub">'+deskLabel(m.id)+(m.slot?' &middot; '+m.slot:'')+' &middot; '+S.office+' &middot; '+dateDisplay+'</div>'+
    (isMine?'<div class="modal-info modal-info-green">\u2713 You have this '+lbl.toLowerCase()+' booked.</div>':'')+
    (isBooked?'<div class="modal-info modal-info-red">Booked by '+(existing.userName||'someone')+'</div>':'')+
    (!existing&&m.type==='room'?
      '<div class="modal-row"><label>Duration</label><select id="mDur"><option value="30">30 min</option><option value="60" selected>1 hour</option><option value="120">2 hours</option></select></div>'+
      '<div class="modal-row"><label>Meeting title (optional)</label><input id="mTit" type="text" placeholder="e.g. Team standup"/></div>'
    :'')+
    '<div class="modal-actions">'+
      '<button class="btn-secondary" id="mCls">Close</button>'+
      (isMine&&existing?'<button class="btn-danger" id="mCan" data-bid="'+existing.id+'">Cancel booking</button>':'')+
      ((isMine||isMyFixed)&&m.type==='desk'&&!CI.get(S.office,m.id,date)?'<button class="btn-primary" id="mCI">✓ Check in</button>':'')+
      ((isMine||isMyFixed)&&m.type==='desk'&&CI.get(S.office,m.id,date)?'<span style="color:var(--green);font-size:13px">✓ Checked in</span><button class="btn-secondary" id="mCO" style="margin-left:8px">Check out</button>':'')+
      (!existing&&!isMyFixed&&m.type!=='room'?'<button class="btn-primary" id="mCnf">Book</button>':'')+
    '</div></div></div>';
}

  document.getElementById('checkout-btn')?.addEventListener('click',async function(e){

  if(S.modal){

    document.getElementById('mCI')?.addEventListener('click',async function(){
      await CI.add(S.office,S.modal.id,ds(S.dayOffset),S.user.id,S.user.name);
      setState({modal:null});toast('Checked in ✓');
    });
    document.getElementById('mCO')?.addEventListener('click',async function(){
      await CI.remove(S.office,S.modal.id,ds(S.dayOffset),S.user.id);
      setState({modal:null});toast('Checked out');
    });

      var m=S.modal,date=ds(S.dayOffset);

      if(m.type==='parking'){var ex=BK.forOD(S.office,date).find(function(b){return b.type==='parking'&&b.userId===S.user.id});if(ex){toast('You already have a parking spot today','error');return}}

// ═══ INIT ═══
async function initApp(){
  render(); // show login immediately

  const account = await Auth.init();
  if(account){
    const user = Auth.getUser();
    DB.set('user', user);
    // Save/update this user in Supabase
    await USERS.upsert(user);
    // Load all data in parallel
    await Promise.all([FF.load(), RF.load(), CI.load(), USERS.load()]);
    await BK.loadOD(user.office||'Marbella', ds(0));
    await BK.loadUser(user.id);
    setState({user, office: user.office||'Marbella'});
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){ initApp().catch(e=>console.error('initApp error:', e)); });
} else {
  initApp().catch(e=>console.error('initApp error:', e));
}
